{{- if .Values.webui.passwordPBKDF2 }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "qbittorrent.fullname" . }}-webui
  labels:
    {{- include "qbittorrent.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.webui.username | quote }}
  password-pbkdf2: {{ .Values.webui.passwordPBKDF2 | quote }}
{{- end }}
